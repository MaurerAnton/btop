name: Build Arch Linux ARM Package

permissions: {}

on:
  workflow_dispatch:
  push:
    branches: main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - '!src/osx/**'
      - '!src/freebsd/**'
      - '!src/netbsd/**'
      - '!src/openbsd/**'
      - 'include/**'
      - 'Makefile'
      - 'PKGBUILD'
      - '.github/workflows/build-arch-arm.yml'
  pull_request:
    branches: main
    paths:
      - 'src/**'
      - '!src/osx/**'
      - '!src/freebsd/**'
      - '!src/netbsd/**'
      - '!src/openbsd/**'
      - 'include/**'
      - 'Makefile'
      - 'PKGBUILD'
      - '.github/workflows/build-arch-arm.yml'

jobs:
  build-arch-pkg:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    continue-on-error: true
    strategy:
      matrix:
        toolchain:
          - aarch64-unknown-linux-musl
    env:
      TOOLCHAIN: "${{ matrix.toolchain }}"
      PKGNAME: "btop-panfrost"
      PKGVER: "1.4.7"
      PKGREL: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cross toolchain
        run: |
          wget -q -P /tmp https://github.com/cross-tools/musl-cross/releases/download/20260430/${TOOLCHAIN}.tar.xz
          wget -q -P /tmp https://github.com/cross-tools/musl-cross/releases/download/20260430/${TOOLCHAIN}.tar.xz.sha256
          echo "$(cat /tmp/${{ matrix.toolchain }}.tar.xz.sha256) /tmp/${{ matrix.toolchain }}.tar.xz" | sha256sum --check --status
          mkdir -p /opt/x-tools/
          tar -xf /tmp/${TOOLCHAIN}.tar.xz -C /opt/x-tools

      - name: Install packager tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools

      - name: Compile btop for aarch64
        run: |
          export CXX=/opt/x-tools/${TOOLCHAIN}/bin/${TOOLCHAIN}-g++
          make GPU_SUPPORT=true INTEL_GPU_SUPPORT=false STATIC=true STRIP=true

      - name: Create Arch package structure
        run: |
          set -e
          GIT_HASH=$(git rev-parse --short "${{ github.sha }}")
          ARCH="aarch64"
          BUILDDIR="/tmp/pkgbuild"
          PKGDIR="${BUILDDIR}/pkg"
          PKG_FILE="${PKGNAME}-${PKGVER}-${PKGREL}-${ARCH}"

          mkdir -p "${PKGDIR}/usr/bin"
          mkdir -p "${PKGDIR}/usr/share/applications"
          mkdir -p "${PKGDIR}/usr/share/icons/hicolor/48x48/apps"
          mkdir -p "${PKGDIR}/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "${PKGDIR}/usr/share/btop/themes"

          install -Dm755 bin/btop "${PKGDIR}/usr/bin/btop"
          install -Dm644 btop.desktop "${PKGDIR}/usr/share/applications/btop.desktop"
          cp Img/icon.png "${PKGDIR}/usr/share/icons/hicolor/48x48/apps/btop.png"
          cp Img/icon.svg "${PKGDIR}/usr/share/icons/hicolor/scalable/apps/btop.svg"
          cp themes/*.theme "${PKGDIR}/usr/share/btop/themes/"

          PKGSIZE=$(du -sb "${PKGDIR}" | cut -f1)
          BUILDDATE=$(date -u +%s)

          python3 -c "
          import textwrap
          content = textwrap.dedent('''\
              pkgname = ${PKGNAME}
              pkgbase = ${PKGNAME}
              pkgver = ${PKGVER}-${PKGREL}
              pkgdesc = Resource monitor with Panfrost GPU support (for PineTab2 / Mali)
              url = https://github.com/MaurerAnton/btop
              builddate = ${BUILDDATE}
              packager = GitHub Actions CI
              size = ${PKGSIZE}
              arch = ${ARCH}
              license = Apache-2.0
          ''').lstrip()
          with open('${PKGDIR}/.PKGINFO', 'w') as f:
              f.write(content)
          "

          cd "${PKGDIR}"
          LANG=C bsdtar -czf .MTREE --format=mtree \
            --options='!all,use-set,type,uid,gid,mode,time,size,md5,sha256,link' \
            --exclude='.PKGINFO' --exclude='.MTREE' --exclude='.BUILDINFO' .

          cd "${PKGDIR}"
          bsdtar -cf - .PKGINFO .MTREE usr | xz -c -T0 > "${BUILDDIR}/${PKG_FILE}.pkg.tar.xz"

          echo "PKG_FILE=${PKG_FILE}" >> "${GITHUB_ENV}"
          echo "BUILDDIR=${BUILDDIR}" >> "${GITHUB_ENV}"

      - name: Sign package with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
          gpg --batch --yes --detach-sign \
            --pinentry-mode loopback \
            --passphrase '' \
            "${BUILDDIR}/${PKG_FILE}.pkg.tar.xz"

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.PKG_FILE }}
          path: |
            ${{ env.BUILDDIR }}/${{ env.PKG_FILE }}.pkg.tar.xz
            ${{ env.BUILDDIR }}/${{ env.PKG_FILE }}.pkg.tar.xz.sig

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUILDDIR }}/${{ env.PKG_FILE }}.pkg.tar.xz
            ${{ env.BUILDDIR }}/${{ env.PKG_FILE }}.pkg.tar.xz.sig
          body: |
            ## btop-panfrost — PineTab2 / Mali GPU мониторинг

            Сборка btop с поддержкой Panfrost (Mali-G52/Bifrost) — GPU utilization, частота, температура.

            ### Установка на PineTab2 (Arch ARM)
            ```
            pacman -U ${{ env.PKG_FILE }}.pkg.tar.xz
            ```
          generate_release_notes: true
